name: IndicTrans2 Output Smoke Test

on:
  push:
    branches:
      - test/nllb-output

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install onnxruntime huggingface-hub IndicTransToolkit 'transformers>=4.54,<5'

      - name: Translate Hindi to Santali
        run: |
          python - <<'PY'
          import importlib.util
          from huggingface_hub import hf_hub_download

          model_id = "hari31416/indictrans2-indic-indic-dist-320M-ONNX-int8"
          source_lang = "hin_Deva"
          target_lang = "sat_Olck"
          samples = [
              "नमस्ते, आप कैसे हैं?",
              "मेरा नाम आदित्य है।",
              "आज मौसम अच्छा है।",
          ]

          helper_path = hf_hub_download(repo_id=model_id, filename="translate.py")
          spec = importlib.util.spec_from_file_location("indictrans_onnx", helper_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          model = module.IndicTransONNX(model_id)

          print("MODEL:", model_id)
          print("SOURCE:", source_lang)
          print("TARGET:", target_lang)

          for text in samples:
              output = model.translate(
                  text,
                  src_lang=source_lang,
                  tgt_lang=target_lang,
              )
              print("INPUT:", text)
              print("OUTPUT:", output)
              print("---")
          PY
