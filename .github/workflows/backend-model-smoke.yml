name: Backend IndicTrans2 Smoke Test

on:
  push:
    branches:
      - fix/indictrans2-backend

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Exercise backend translation runtime
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")

          import main

          samples = [
              "नमस्ते, आप कैसे हैं?",
              "मेरा नाम आदित्य है।",
              "आज मौसम अच्छा है।",
          ]

          print("MODEL:", main.MODEL_NAME)
          print("REVISION:", main.MODEL_REVISION)

          for text in samples:
              output = main.translate_text(text)
              assert main.has_meaningful_ol_chiki(output)
              print("INPUT:", text)
              print("OUTPUT:", output)
              print("OL_CHIKI_RATIO:", round(main.ol_chiki_letter_ratio(output), 3))
              print("---")
          PY
