name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check backend Python syntax
        run: python3 -m py_compile backend/main.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0.2'

      - name: Run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

  nllb-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers==4.51.3 sentencepiece protobuf

      - name: Run real Hindi to Santhali translation
        run: |
          python - <<'PY'
          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          model_name = "facebook/nllb-200-distilled-600M"
          source_lang = "hin_Deva"
          target_lang = "sat_Olck"
          samples = [
              "नमस्ते, आप कैसे हैं?",
              "मेरा नाम आदित्य है।",
              "आज मौसम अच्छा है।",
          ]

          tokenizer = AutoTokenizer.from_pretrained(
              model_name,
              src_lang=source_lang,
              tgt_lang=target_lang,
          )
          model = AutoModelForSeq2SeqLM.from_pretrained(model_name)
          model.eval()
          target_token_id = tokenizer.convert_tokens_to_ids(target_lang)

          print("MODEL:", model_name)
          print("SOURCE:", source_lang)
          print("TARGET:", target_lang)

          for text in samples:
              encoded = tokenizer(text, return_tensors="pt", truncation=True, max_length=512)
              with torch.inference_mode():
                  generated = model.generate(
                      **encoded,
                      forced_bos_token_id=target_token_id,
                      max_new_tokens=96,
                      num_beams=1,
                  )
              output = tokenizer.batch_decode(generated, skip_special_tokens=True)[0].strip()
              print("INPUT:", text)
              print("OUTPUT:", output)
              print("---")
          PY
